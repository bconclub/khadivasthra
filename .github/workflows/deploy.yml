name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Stamp version.json
        run: |
          BUILD_NUM=${{ github.run_number }}
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DEPLOY_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > public/version.json << EOF
          {
            "version": "1.0.${BUILD_NUM}",
            "build": ${BUILD_NUM},
            "deployedAt": "${DEPLOY_TIME}",
            "commit": "${COMMIT_SHA}"
          }
          EOF

          echo "=== Version ==="
          cat public/version.json

      - name: Build Next.js static export
        run: npm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy

          # 1. Copy Next.js static export
          cp -r out/* deploy/

          # 2. Merge admin PHP backend into admin/ directory
          mkdir -p deploy/admin/api
          mkdir -p deploy/admin/includes
          mkdir -p deploy/admin/data
          mkdir -p deploy/admin/uploads

          # PHP API endpoints
          cp admin/api/*.php deploy/admin/api/

          # PHP includes (config, functions, auth)
          cp admin/includes/*.php deploy/admin/includes/

          # Admin .htaccess for Apache PHP processing
          cp admin/.htaccess deploy/admin/

          # Seed data files
          cp admin/data/*.json deploy/admin/data/ 2>/dev/null || true
          touch deploy/admin/uploads/.gitkeep

          echo "=== Deploy directory ready ==="
          find deploy/admin -type f | sort

      - name: Deploy Supabase Edge Functions
        run: |
          npx supabase functions deploy create-razorpay-order --project-ref etjxdomvtsxrnbjmjzxz
          npx supabase functions deploy verify-razorpay-payment --project-ref etjxdomvtsxrnbjmjzxz
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy via FTP
        run: |
          sudo apt-get install -y lftp > /dev/null 2>&1

          # First, verify the correct target directory exists
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_HOST }}" -e "
            pwd;
            ls;
            quit
          " 2>&1 | head -20

          echo "=== Deploying to domains/khadivasthra.com/public_html/ ==="

          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_HOST }}" -e "
            set ftp:ssl-allow no;
            set mirror:use-pget-n 5;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --verbose --parallel=5 \
              --exclude-glob .git* \
              --exclude-glob node_modules/ \
              ./deploy/ domains/khadivasthra.com/public_html/;
            quit
          "

          echo "=== Deploy complete ==="
