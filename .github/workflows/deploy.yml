name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # These NEXT_PUBLIC values are browser credentials already embedded in the
    # storefront bundle. Never add the Supabase service-role key here.
    env:
      NEXT_PUBLIC_SUPABASE_URL: 'https://etjxdomvtsxrnbjmjzxz.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0anhkb212dHN4cm5iam1qenh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5NzM1NDYsImV4cCI6MjA4NjU0OTU0Nn0.wGyjd0vq35jhiqINXtt4cneevGXUYb49XRzWyYUD4xY'
      NEXT_PUBLIC_RAZORPAY_KEY_ID: 'rzp_live_SK4KuQeOlV5'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Stamp version.json
        run: |
          BUILD_NUM=${{ github.run_number }}
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DEPLOY_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > public/version.json << EOF
          {
            "version": "1.0.${BUILD_NUM}",
            "build": ${BUILD_NUM},
            "deployedAt": "${DEPLOY_TIME}",
            "commit": "${COMMIT_SHA}"
          }
          EOF

          echo "=== Version ==="
          cat public/version.json

      - name: Build Next.js static export
        run: npm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy

          # Next.js export already contains storefront and admin routes.
          cp -r out/* deploy/

          echo "=== Deploy directory ready ==="
          test -f deploy/index.html
          test -f deploy/admin/index.html
          test -f deploy/version.json

      - name: Deploy via FTP
        run: |
          sudo apt-get install -y lftp > /dev/null 2>&1

          # First, verify the correct target directory exists
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_HOST }}" -e "
            pwd;
            ls;
            quit
          " 2>&1 | head -20

          echo "=== Deploying to domains/khadivasthra.com/public_html/ ==="

          set +e
          FTP_LOG=$(mktemp)
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_HOST }}" -e "
            set ftp:ssl-allow no;
            set mirror:use-pget-n 5;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --verbose --parallel=5 \
              --exclude-glob .git* \
              --exclude-glob node_modules/ \
              ./deploy/ domains/khadivasthra.com/public_html/;
            quit
          " > "$FTP_LOG" 2>&1
          FTP_STATUS=$?
          tail -50 "$FTP_LOG"

          if [ "$FTP_STATUS" -ne 0 ]; then
            FTP_ERROR=$(tail -10 "$FTP_LOG" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Hostinger FTP failed::$FTP_ERROR"
            exit "$FTP_STATUS"
          fi

          echo "=== Deploy complete ==="
